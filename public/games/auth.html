<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in — SJO Games</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fb;color:#111827;font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{width:100%;max-width:380px;background:#fff;border:1px solid #e2e6ee;border-radius:23px;padding:28px;box-shadow:0 13px 32px #1118270b}
.logo{width:50px;height:50px;border-radius:17px;background:#111827;color:#fff;display:grid;place-items:center;font-size:26px;margin:0 auto 14px}
h1{font-size:20px;text-align:center;margin:0 0 4px}
.sub{font-size:12px;color:#7b8497;text-align:center;margin:0 0 20px}
label{display:block;font-size:11px;font-weight:700;color:#3157d5;margin-bottom:5px}
input{width:100%;border:1px solid #e0e5ed;background:#fff;border-radius:14px;padding:12px 14px;font-size:14px;outline:none;margin-bottom:14px}
input:focus{border-color:#3157d5}
button{cursor:pointer;border:0;font-weight:800;border-radius:14px;padding:13px;width:100%;font-size:14px}
.primary{background:#111827;color:#fff;margin-top:2px}
.primary:disabled{opacity:.5;cursor:default}
.google{background:#0f1b3d;color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px}
.divider{display:flex;align-items:center;gap:10px;margin:16px 0;color:#9aa3b2;font-size:11px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:#e2e6ee}
.toggle{text-align:center;font-size:12px;color:#7b8497;margin-top:16px}
.toggle a{color:#3157d5;font-weight:700;text-decoration:none;cursor:pointer}
.err{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;border-radius:12px;padding:9px 12px;font-size:12px;margin-bottom:14px;display:none}
.msg{background:#eef5ff;color:#1e4a9c;border:1px solid #cfe0ff;border-radius:12px;padding:9px 12px;font-size:12px;margin-bottom:14px;display:none}
</style></head>
<body>
<div class="card">
  <div class="logo">🎮</div>
  <h1 id="title">Sign in to play</h1>
  <p class="sub" id="subtitle">Track your scores, XP and coins across devices</p>

  <div class="err" id="err"></div>
  <div class="msg" id="msg"></div>

  <form id="form">
    <label>E-mail</label>
    <input type="email" id="email" required placeholder="example@email.com">
    <label>Password</label>
    <input type="password" id="password" required placeholder="Your password" minlength="6">
    <button type="submit" class="primary" id="submitBtn">Sign in</button>
  </form>

  <div class="divider">or</div>
  <button class="google" id="googleBtn">Sign in with Google</button>

  <p class="toggle" id="toggle">Don't have an account? <a>Sign up</a></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
// ---- Connected to the SJO-ERP portal's Supabase project (shared login) ----
const SUPABASE_URL = "https://kxusesmymrlbjsbppikm.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_T8sMx32GuOd8V5tvtb3gPg_RQHhrQ1h";
// --------------------------------------------------------------------------------

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const form = document.getElementById('form');
const emailEl = document.getElementById('email');
const passEl = document.getElementById('password');
const errEl = document.getElementById('err');
const msgEl = document.getElementById('msg');
const submitBtn = document.getElementById('submitBtn');
const title = document.getElementById('title');
const subtitle = document.getElementById('subtitle');
const toggleText = document.getElementById('toggle');
const googleBtn = document.getElementById('googleBtn');

let mode = 'signin'; // or 'signup'

function showError(msg){ errEl.textContent = msg; errEl.style.display = 'block'; msgEl.style.display = 'none'; }
function showMsg(msg){ msgEl.textContent = msg; msgEl.style.display = 'block'; errEl.style.display = 'none'; }
function clearNotices(){ errEl.style.display = 'none'; msgEl.style.display = 'none'; }

function redirectTarget(){
  const params = new URLSearchParams(location.search);
  return params.get('redirect') || 'index.html';
}

// If the portal handed off a session (see openGames() in Login.jsx), adopt
// it immediately instead of showing the login form.
async function tryHandoff(){
  const params = new URLSearchParams(location.search);
  const access_token = params.get('at');
  const refresh_token = params.get('rt');
  if (!access_token || !refresh_token) return false;
  const { error } = await sb.auth.setSession({ access_token, refresh_token });
  if (error) return false;
  window.location.href = redirectTarget();
  return true;
}

// Event delegation so the toggle keeps working after innerHTML swaps the <a> node
toggleText.addEventListener('click', (e) => {
  if (e.target.tagName !== 'A') return;
  mode = mode === 'signin' ? 'signup' : 'signin';
  clearNotices();
  if (mode === 'signup') {
    title.textContent = 'Create your account';
    subtitle.textContent = 'One account, every game, synced everywhere';
    submitBtn.textContent = 'Sign up';
    toggleText.innerHTML = 'Already have an account? <a>Sign in</a>';
  } else {
    title.textContent = 'Sign in to play';
    subtitle.textContent = 'Track your scores, XP and coins across devices';
    submitBtn.textContent = 'Sign in';
    toggleText.innerHTML = 'Don\'t have an account? <a>Sign up</a>';
  }
});

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  clearNotices();
  submitBtn.disabled = true;
  submitBtn.textContent = mode === 'signup' ? 'Signing up…' : 'Signing in…';

  const email = emailEl.value.trim();
  const password = passEl.value;

  const { data, error } = mode === 'signup'
    ? await sb.auth.signUp({ email, password })
    : await sb.auth.signInWithPassword({ email, password });

  submitBtn.disabled = false;
  submitBtn.textContent = mode === 'signup' ? 'Sign up' : 'Sign in';

  if (error) { showError(error.message); return; }

  if (mode === 'signup' && data.user && !data.session) {
    showMsg('Check your email to confirm your account, then sign in.');
    return;
  }

  window.location.href = redirectTarget();
});

googleBtn.addEventListener('click', async () => {
  clearNotices();
  const { error } = await sb.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: window.location.origin + '/' + redirectTarget() }
  });
  if (error) showError(error.message);
});

// If already signed in, skip straight through
tryHandoff().then((handled) => {
  if (handled) return;
  sb.auth.getSession().then(({ data }) => {
    if (data.session) window.location.href = redirectTarget();
  });
});
</script>
</body></html>
