<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SJO Ludo</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fb;color:#111827;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
.app{max-width:560px;margin:auto;min-height:100vh;padding:16px 14px 28px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.brand{display:flex;gap:10px;align-items:center}.logo{width:44px;height:44px;border-radius:14px;background:#111827;color:#fff;display:grid;place-items:center;font-size:22px}h1{font-size:21px;margin:0}.sub{font-size:12px;color:#7b8497}
.icon{width:43px;height:43px;border:1px solid #e0e5ee;background:#fff;border-radius:13px;font-size:19px}
.hero{background:#111827;color:#fff;border-radius:23px;padding:16px;margin-bottom:13px}.top{display:flex;justify-content:space-between;align-items:center}.eyebrow{text-transform:uppercase;letter-spacing:1.2px;font-size:10px;opacity:.6}.hero h2{margin:3px 0 0;font-size:22px}.turn{background:#ffffff12;border:1px solid #ffffff1d;border-radius:12px;padding:9px 11px;font-weight:800}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:13px}.stat{background:#ffffff10;border:1px solid #ffffff16;border-radius:13px;padding:8px;text-align:center}.stat b{display:block;font-size:17px}.stat span{font-size:10px;opacity:.6}
.card{background:#fff;border:1px solid #e4e8f0;border-radius:23px;padding:11px;box-shadow:0 12px 34px #1118270d}
#board{width:min(94vw,480px);aspect-ratio:1;margin:auto;position:relative;border-radius:16px;overflow:hidden;background:#fff;border:2px solid #111827;display:grid;grid-template-columns:repeat(15,1fr);grid-template-rows:repeat(15,1fr)}
.cell{border:1px solid #dfe3eb;background:#fff}.homeR{background:#fee2e2}.homeG{background:#dcfce7}.homeY{background:#fef3c7}.homeB{background:#dbeafe}.path{background:#fff}.center{background:conic-gradient(#ef4444 0 25%,#facc15 25% 50%,#22c55e 50% 75%,#3b82f6 75% 100%);border:2px solid #111827}
.token{position:absolute;width:8%;aspect-ratio:1;border-radius:50%;border:3px solid #fff;box-shadow:0 3px 7px #11182755;z-index:3;transform:translate(-50%,-50%);display:grid;place-items:center;color:white;font-size:10px;font-weight:900;cursor:pointer}
.red{background:#ef4444}.green{background:#22c55e}.yellow{background:#eab308}.blue{background:#3b82f6}
.diceArea{display:flex;align-items:center;justify-content:center;gap:12px;margin:13px 0 4px}.dice{width:62px;height:62px;border:0;border-radius:18px;background:#111827;color:#fff;font-size:34px;font-weight:800;box-shadow:0 8px 18px #11182725}.roll{border:0;border-radius:14px;padding:13px 18px;background:#3157d5;color:#fff;font-weight:800}.roll:disabled{opacity:.45}
.message{text-align:center;min-height:22px;color:#687286;font-size:12px;padding-top:7px}.rules{text-align:center;color:#8a92a2;font-size:10px;margin-top:8px}
.mode{display:flex;gap:7px;margin-bottom:10px}.mode button{flex:1;border:0;border-radius:12px;padding:10px;background:#eef1f7;font-weight:800;color:#5d6679}.mode button.active{background:#111827;color:#fff}
.overlay{position:fixed;inset:0;background:#11182799;display:none;align-items:flex-end;padding:14px}.modal{width:min(530px,100%);background:#fff;border-radius:25px;padding:25px;text-align:center}.emoji{font-size:44px}.modal h2{margin:6px}.modal p{color:#667085}.modal button{width:100%;border:0;border-radius:14px;padding:13px;background:#111827;color:#fff;font-weight:800}
</style>

<style id="sjo-nav">
#sjoNav{position:sticky;top:0;z-index:9999;display:flex;justify-content:space-between;align-items:center;
padding:9px 12px;background:#111827;color:#fff;font:700 13px system-ui;border-radius:0 0 14px 14px;box-shadow:0 5px 18px #11182722}
#sjoNav a{color:#fff;text-decoration:none;background:#ffffff18;border:1px solid #ffffff25;padding:7px 10px;border-radius:9px}
</style>
</head>
<body><nav id="sjoNav"><span>🎮 SJO Games</span><a href="index.html">⌂ Games</a></nav>
<div class="app">
<header><div class="brand"><div class="logo">🎲</div><div><h1>SJO Ludo</h1><div class="sub">Roll • Move • Race</div></div></div><button class="icon" onclick="newGame()">↻</button></header>
<section class="hero">
<div class="top"><div><div class="eyebrow">Classic board game</div><h2>Race your tokens home</h2></div><div class="turn" id="turn">Red</div></div>
<div class="stats"><div class="stat"><b id="players">2</b><span>PLAYERS</span></div><div class="stat"><b id="rolls">0</b><span>ROLLS</span></div><div class="stat"><b id="home">0/4</b><span>HOME</span></div></div>
</section>
<section class="card">
<div class="mode"><button id="p2" class="active" onclick="setPlayers(2)">2 Players</button><button id="p4" onclick="setPlayers(4)">4 Players</button></div>
<div id="board"></div>
<div class="diceArea"><button class="dice" id="dice" onclick="rollDice()">⚀</button><button class="roll" id="rollBtn" onclick="rollDice()">ROLL DICE</button></div>
<div class="message" id="message">Red starts. Roll a 6 to bring a token out.</div>
<div class="rules">Local/offline multiplayer. Tap a highlighted token after rolling. A 6 gives another turn.</div>
</section>
</div>
<div class="overlay" id="win"><div class="modal"><div class="emoji">🏆</div><h2 id="winTitle">Red wins!</h2><p>All four tokens reached home.</p><button onclick="document.getElementById('win').style.display='none';newGame()">Play Again</button></div></div>

<script src="sjo-core.js"></script>
<script>
const colors=['red','green','yellow','blue'];
let players=2,turn=0,dice=0,rollCount=0,gameOver=false,homeCounts=[0,0,0,0];
let tokens,paths;
const emoji={red:'🔴',green:'🟢',yellow:'🟡',blue:'🔵'};
const start=[0,13,26,39];
function makePaths(){let p=[];for(let k=0;k<4;k++){let a=[];for(let i=0;i<52;i++)a.push((start[k]+i)%52);p.push(a)}return p}
paths=makePaths();
function newGame(){turn=0;dice=0;rollCount=0;gameOver=false;homeCounts=[0,0,0,0];tokens=Array.from({length:4},()=>Array(4).fill(-1));document.getElementById('win').style.display='none';document.getElementById('dice').textContent='⚀';update();render();msg('Red starts. Roll a 6 to bring a token out.')}
function setPlayers(n){players=n;document.getElementById('p2').classList.toggle('active',n===2);document.getElementById('p4').classList.toggle('active',n===4);newGame()}
function msg(t){document.getElementById('message').textContent=t}
function update(){document.getElementById('players').textContent=players;document.getElementById('rolls').textContent=rollCount;document.getElementById('home').textContent=homeCounts.slice(0,players).reduce((a,b)=>a+b,0)+'/ '+(players*4);document.getElementById('turn').textContent=colors[turn][0].toUpperCase()+colors[turn].slice(1)}
function grid(){let b=document.getElementById('board');b.innerHTML='';for(let r=0;r<15;r++)for(let c=0;c<15;c++){let d=document.createElement('div');d.className='cell';if(r<6&&c<6)d.classList.add('homeR');else if(r<6&&c>8)d.classList.add('homeG');else if(r>8&&c<6)d.classList.add('homeB');else if(r>8&&c>8)d.classList.add('homeY');else if(r>=6&&r<=8&&c>=6&&c<=8)d.classList.add('center');else d.classList.add('path');b.appendChild(d)}}
function posFromIndex(i){let r,c;let ring=[];for(let c0=1;c0<14;c0++)ring.push([6,c0]);for(let r0=7;r0<14;r0++)ring.push([r0,13]);for(let c0=12;c0>=1;c0--)ring.push([13,c0]);for(let r0=12;r0>=7;r0--)ring.push([r0,1]);return ring[i%ring.length]}
function homePos(color,i){let spots=[[3,3],[3,5],[5,3],[5,5],[3,10],[3,12],[5,10],[5,12],[10,3],[10,5],[12,3],[12,5],[10,10],[10,12],[12,10],[12,12]];return spots[color*4+i]}
function render(){grid();let board=document.getElementById('board');for(let p=0;p<players;p++)for(let t=0;t<4;t++){let token=document.createElement('div');token.className='token '+colors[p];let st=tokens[p][t],xy;if(st<0){let h=homePos(p,t);xy=[h[1],h[0]]}else if(st>=52){xy=[7+(st-52)*0.7,7]}else{let q=posFromIndex(paths[p][st]);xy=[q[1],q[0]]}token.style.left=((xy[0]+.5)/15*100)+'%';token.style.top=((xy[1]+.5)/15*100)+'%';token.textContent=t+1;if(dice&&p===turn&&canMove(p,t))token.style.outline='4px solid #fff';token.onclick=()=>moveToken(p,t);board.appendChild(token)}update()}
function canMove(p,t){let st=tokens[p][t];if(st>=52)return false;if(st<0)return dice===6;return st+dice<=57}
function rollDice(){if(gameOver||dice)return;dice=Math.floor(Math.random()*6)+1;rollCount++;document.getElementById('dice').textContent=['','⚀','⚁','⚂','⚃','⚄','⚅'][dice];let moves=[];for(let t=0;t<4;t++)if(canMove(turn,t))moves.push(t);if(!moves.length){msg('No legal move. '+(dice===6?'Rolling again.':'Next player.'));let six=dice===6;dice=0;render();if(six)setTimeout(()=>{},350);else nextTurn();return}msg(dice===6?'Choose a token. You get another turn after moving.':'Choose a highlighted token.');render()}
function moveToken(p,t){if(gameOver||p!==turn||!canMove(p,t)||!dice)return;let st=tokens[p][t];if(st<0)tokens[p][t]=0;else tokens[p][t]+=dice;let landed=tokens[p][t];if(landed>=52){homeCounts[p]++;tokens[p][t]=57} // finished token
// simple capture on shared path
if(tokens[p][t]<52){let absolute=paths[p][tokens[p][t]];for(let op=0;op<players;op++)if(op!==p)for(let ot=0;ot<4;ot++){let os=tokens[op][ot];if(os>=0&&os<52&&paths[op][os]===absolute){tokens[op][ot]=-1;msg('Captured '+colors[op]+' token!')}}}
let won=homeCounts[p]>=4;let six=dice===6;dice=0;render();if(won){gameOver=true;document.getElementById('winTitle').textContent=colors[p][0].toUpperCase()+colors[p].slice(1)+' wins!';document.getElementById('win').style.display='flex';window.SJO.record(p===0?'win':'loss',homeCounts[p]*250+rollCount,{players,rollCount,home:homeCounts[p]});window.SJOGamesV9&&window.SJOGamesV9.record('Ludo',p===0?'win':'loss',homeCounts[p]*250+rollCount);return}if(six){msg('🎉 Six! '+colors[p]+' gets another turn.');return}nextTurn()}
function nextTurn(){turn=(turn+1)%players;dice=0;render();msg(colors[turn][0].toUpperCase()+colors[turn].slice(1)+' turn. Roll the dice.')}
newGame();
</script>
<script src="sjo-v8-offline.js"></script>
<script src="sjo-v9-advanced-offline.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="sjo-supabase-sync.js"></script>
</body>
</html>
