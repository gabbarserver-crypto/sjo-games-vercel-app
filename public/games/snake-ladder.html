<style>
*{box-sizing:border-box}
body.sl{margin:0;min-height:100vh;color:#e8f6f3;font-family:system-ui,-apple-system,Segoe UI,sans-serif;-webkit-user-select:none;user-select:none;
background:radial-gradient(900px 520px at 50% -10%,#2c7a76,transparent 65%),linear-gradient(180deg,#0f3d3f,#0a2a30)}
.app{max-width:560px;margin:auto;min-height:100vh;padding:14px 14px 28px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.brand{display:flex;gap:10px;align-items:center}
.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(145deg,#2fb59a,#14776e);color:#fff;display:grid;place-items:center;font-size:22px;box-shadow:0 4px 0 #0a4a45}
h1{margin:0;font-size:21px;color:#fff}.sub{font-size:11px;color:#9cc7c1}
.icon{width:43px;height:43px;border:1px solid #ffffff30;background:#ffffff18;color:#fff;border-radius:13px;font-size:19px;cursor:pointer}
.hero{background:#0b2f33;border:1px solid #ffffff1c;color:#fff;border-radius:23px;padding:14px;margin-bottom:12px;box-shadow:0 10px 26px #0005}
.top{display:flex;justify-content:space-between;align-items:center}.eyebrow{text-transform:uppercase;letter-spacing:1.2px;font-size:10px;opacity:.6}.hero h2{margin:3px 0 0;font-size:19px}
.turn{background:#ffd23f;color:#3a2a00;border-radius:12px;padding:8px 14px;font-weight:900;box-shadow:0 3px 0 #b78900}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.stat{background:#ffffff10;border:1px solid #ffffff16;border-radius:13px;padding:8px;text-align:center}.stat b{display:block;font-size:17px}.stat span{font-size:10px;opacity:.65}
.panel{background:#0b2f33;border:1px solid #ffffff1c;border-radius:23px;padding:11px;box-shadow:0 12px 34px #0006}
#slBoard{width:min(94vw,480px);aspect-ratio:1;margin:auto;position:relative;border-radius:22px;overflow:hidden;border:5px solid #f1e6c6;background:#dfeae6;display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(10,1fr);box-shadow:0 10px 26px #0007}
.sc{position:relative;display:grid;place-items:center;font-size:clamp(11px,3.7vw,19px);font-weight:800;color:#1c3d3c;font-family:"Trebuchet MS",system-ui,sans-serif}
.sc0{background:#e3ede9}.sc1{background:#86a8a4}
.sc.goal{background:radial-gradient(circle,#ffe58a,#f5b82e);color:#6b3d00}
#slFx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.pawn{position:absolute;width:7.2%;aspect-ratio:20/28;transform:translate(-50%,-84%);z-index:4;transition:left .22s ease,top .22s ease;filter:drop-shadow(0 3px 3px #0006)}
.pawn svg{display:block;width:100%;height:100%}
.pawn.active{animation:bob .6s infinite alternate}
@keyframes bob{to{margin-top:-5px}}
.bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin:14px 0 4px}
.side{background:#134e4a;color:#fff;border-radius:14px;padding:11px 8px;text-align:center;font-weight:800;font-size:17px;opacity:.55;transition:.2s;border:2px solid transparent}
.side.on{opacity:1;border-color:#ffd23f;box-shadow:0 0 14px #ffd23f66}.side small{display:block;font-size:10px;font-weight:600;opacity:.8}
.sdice{width:70px;height:70px;border:0;border-radius:18px;background:#fff;color:#111827;font-size:42px;font-weight:800;box-shadow:0 6px 0 #b9c7c4,0 10px 18px #0006;cursor:pointer;line-height:1}
.sdice.rolling{animation:shake .4s}@keyframes shake{25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}
.sdice:disabled{opacity:.65;cursor:default}
.smsg{text-align:center;min-height:22px;color:#b6dad5;font-size:12px;padding-top:7px;font-weight:600}.rules{text-align:center;color:#79a8a2;font-size:10px;margin-top:8px}
.overlay{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:14px;z-index:10000}
.modal{width:min(420px,100%);background:#fff;color:#14231f;border-radius:25px;padding:25px;text-align:center}.emoji{font-size:48px}.modal h2{margin:6px}.modal p{color:#667085}.modal button{border:0;background:#0f3d3f;color:#fff;border-radius:12px;padding:12px 22px;font-weight:800;cursor:pointer}
body.sl .hero{background:linear-gradient(135deg,#0b2f33,#14625f)!important;box-shadow:0 10px 26px #0005!important}
body.sl .hero::before,body.sl .hero::after{display:none}
body.sl .hero .turn{background:#ffd23f!important;color:#3a2a00!important;box-shadow:0 3px 0 #b78900}
body.sl .logo{background:linear-gradient(145deg,#2fb59a,#14776e)!important;box-shadow:0 4px 0 #0a4a45!important}
body.sl .icon{background:#ffffff18!important;border:1px solid #ffffff30!important;color:#fff!important;box-shadow:none!important}
body.sl .sub{color:#9cc7c1!important}
</style>
<style id="sjo-nav">
#sjoNav{position:sticky;top:0;z-index:9999;display:flex;justify-content:space-between;align-items:center;
padding:9px 12px;background:#111827;color:#fff;font:700 13px system-ui;border-radius:0 0 14px 14px;box-shadow:0 5px 18px #11182722}
#sjoNav a{color:#fff;text-decoration:none;background:#ffffff18;border:1px solid #ffffff25;padding:7px 10px;border-radius:9px}

<body class="tp sl"><nav id="sjoNav"><span>🎮 SJO Games</span><a href="index.html">⌂ Games</a></nav>
<div class="app">
<header><div class="brand"><div class="logo">🐍</div><div><h1>SJO Snake &amp; Ladder</h1><div class="sub">Climb • Slide • Reach 100</div></div></div><button class="icon" onclick="newGame()" title="New game">↻</button></header>
<section class="hero">
<div class="top"><div><div class="eyebrow">Classic board game</div><h2>Race to square 100</h2></div><div class="turn" id="turn">You</div></div>
<div class="stats"><div class="stat"><b id="posYou">0</b><span>YOU</span></div><div class="stat"><b id="rolls">0</b><span>ROLLS</span></div><div class="stat"><b id="posCom">0</b><span>COMPUTER</span></div></div>
</section>
<section class="panel">
<div id="slBoard"></div>
<div class="bar">
<div class="side on" id="sideYou">You<small>Blue</small></div>
<button class="sdice" id="dice" onclick="humanRoll()">🎲</button>
<div class="side" id="sideCom">Com<small>Red</small></div>
</div>
<div class="smsg" id="message">Tap the dice to start.</div>
<div class="rules">Ladders take you up, snakes slide you down. A 6 gives another turn. You need the exact number to land on 100.</div>
</section>
</div>
<div class="overlay" id="win"><div class="modal"><div class="emoji" id="winEmoji">🏆</div><h2 id="winTitle">You win!</h2><p id="winText"></p><button onclick="newGame()">Play Again</button></div></div>

<script src="sjo-core.js"></script>
<script>
const LADDERS={4:25,9:31,20:41,28:84,40:59,51:67,63:81,71:91};
const SNAKES={17:7,54:34,62:19,64:60,87:24,93:73,95:75,98:79};
const FACES=['','⚀','⚁','⚂','⚃','⚄','⚅'];
let pos,turn,rolls,busy,over,pawns=[];
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

// square n (1..100) -> centre in 0..100 board units
function xy(n){
  if(n<1)n=0;
  if(n===0)return [5,105];           // start area below square 1
  const r=Math.floor((n-1)/10),i=(n-1)%10,c=r%2===0?i:9-i;
  return [c*10+5,(9-r)*10+5];
}
function buildBoard(){
  const b=$('slBoard');b.innerHTML='';
  for(let row=9;row>=0;row--)for(let col=0;col<10;col++){
    const n=row%2===0?row*10+col+1:row*10+(9-col)+1;
    const d=document.createElement('div');
    d.className='sc sc'+((row+col)%2)+(n===100?' goal':'');
    d.textContent=n===100?'🏁':n;
    b.appendChild(d);
  }
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.id='slFx';svg.setAttribute('viewBox','0 0 100 100');svg.setAttribute('preserveAspectRatio','none');
  let h='';
  for(const [a,z] of Object.entries(LADDERS))h+=ladder(+a,z);
  Object.entries(SNAKES).forEach(([a,z],i)=>h+=snake(+a,z,i));
  svg.innerHTML=h;b.appendChild(svg);
  pawns=['you','com'].map(k=>{const p=document.createElement('div');p.className='pawn '+k;p.innerHTML=pawnSvg(k==='you'?'#2f7de1':'#e5392f',k==='you'?'#1a4f9c':'#9b1c14');b.appendChild(p);return p});
}
function pawnSvg(c,d){
  return `<svg viewBox="0 0 20 28"><ellipse cx="10" cy="25" rx="8.5" ry="2.6" fill="#0004"/>
  <path d="M3.5 24.5 Q4.5 15 8 12.6 A5.2 5.2 0 1 1 12 12.6 Q15.5 15 16.5 24.5 Z" fill="${c}" stroke="${d}" stroke-width="1.1" stroke-linejoin="round"/>
  <circle cx="10" cy="7.2" r="5" fill="${c}" stroke="${d}" stroke-width="1.1"/>
  <ellipse cx="8.2" cy="5.4" rx="1.7" ry="1.2" fill="#fff" opacity=".55"/>
  <path d="M6.5 20 Q6.8 16.5 8 15" stroke="#fff" stroke-width="1.2" fill="none" opacity=".4" stroke-linecap="round"/></svg>`;
}
function ladder(a,z){
  const [x1,y1]=xy(a),[x2,y2]=xy(z);
  const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy),nx=-dy/L*2.1,ny=dx/L*2.1;
  const rungs=Math.max(3,Math.round(L/4.6));
  let s=`<g stroke-linecap="round" fill="none"><g transform="translate(.7 .9)" stroke="#00000030">
  <line x1="${x1+nx}" y1="${y1+ny}" x2="${x2+nx}" y2="${y2+ny}" stroke-width="2"/><line x1="${x1-nx}" y1="${y1-ny}" x2="${x2-nx}" y2="${y2-ny}" stroke-width="2"/></g>`;
  for(let i=0;i<=rungs;i++){const t=(i+.5)/(rungs+1),px=x1+dx*t,py=y1+dy*t;
    s+=`<line x1="${px+nx}" y1="${py+ny}" x2="${px-nx}" y2="${py-ny}" stroke="#8a5a26" stroke-width="1.9"/>`}
  s+=`<line x1="${x1+nx}" y1="${y1+ny}" x2="${x2+nx}" y2="${y2+ny}" stroke="#8a5a26" stroke-width="2"/><line x1="${x1-nx}" y1="${y1-ny}" x2="${x2-nx}" y2="${y2-ny}" stroke="#8a5a26" stroke-width="2"/>`;
  for(let i=0;i<=rungs;i++){const t=(i+.5)/(rungs+1),px=x1+dx*t,py=y1+dy*t;
    s+=`<line x1="${px+nx}" y1="${py+ny}" x2="${px-nx}" y2="${py-ny}" stroke="#f0cf8f" stroke-width="1.1"/>`}
  s+=`<line x1="${x1+nx}" y1="${y1+ny}" x2="${x2+nx}" y2="${y2+ny}" stroke="#f3dca8" stroke-width="1.2"/><line x1="${x1-nx}" y1="${y1-ny}" x2="${x2-nx}" y2="${y2-ny}" stroke="#f3dca8" stroke-width="1.2"/>`;
  return s+`</g>`;
}
const SNAKE_COLORS=['#c62828','#c026d3','#7c3aed','#1e3a8a','#ec4899','#d9480f','#0f9d8a','#5b8c1a'];
function snake(a,z,idx){ // head at a (high), tail at z (low)
  const [x1,y1]=xy(a),[x2,y2]=xy(z);
  const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy),nx=-dy/L,ny=dx/L;
  const waves=Math.max(2,Math.round(L/13)),N=44,pts=[];
  for(let i=0;i<=N;i++){const t=i/N,amp=2.6*Math.sin(Math.PI*Math.min(1,t*1.15))+.4*(1-t);
    const w=Math.sin(t*Math.PI*2*waves)*amp;pts.push([x1+dx*t+nx*w,y1+dy*t+ny*w])}
  const col=SNAKE_COLORS[idx%SNAKE_COLORS.length];
  const wd=i=>2.7*(1-.72*(i/N));
  let s='<g stroke-linecap="round" stroke-linejoin="round" fill="none">';
  for(let i=0;i<N;i++)s+=`<line x1="${pts[i][0].toFixed(2)}" y1="${pts[i][1].toFixed(2)}" x2="${pts[i+1][0].toFixed(2)}" y2="${pts[i+1][1].toFixed(2)}" stroke="#00000055" stroke-width="${(wd(i)+.7).toFixed(2)}"/>`;
  for(let i=0;i<N;i++)s+=`<line x1="${pts[i][0].toFixed(2)}" y1="${pts[i][1].toFixed(2)}" x2="${pts[i+1][0].toFixed(2)}" y2="${pts[i+1][1].toFixed(2)}" stroke="${col}" stroke-width="${wd(i).toFixed(2)}"/>`;
  for(let i=2;i<N-1;i+=3){const r=wd(i)*.22;s+=`<circle cx="${pts[i][0].toFixed(2)}" cy="${pts[i][1].toFixed(2)}" r="${r.toFixed(2)}" fill="#ffd23f" stroke="none"/>`}
  const ang=Math.atan2(pts[0][1]-pts[2][1],pts[0][0]-pts[2][0])*180/Math.PI;
  s+=`<g transform="translate(${pts[0][0].toFixed(2)} ${pts[0][1].toFixed(2)}) rotate(${ang.toFixed(1)})">
   <path d="M2.4 0 L4.6 -.5 M2.4 0 L4.6 .5" stroke="#e11d48" stroke-width=".35"/>
   <ellipse cx="0" cy="0" rx="2.9" ry="2.3" fill="${col}" stroke="#00000066" stroke-width=".45"/>
   <circle cx=".9" cy="-1.1" r=".8" fill="#fff"/><circle cx=".9" cy="1.1" r=".8" fill="#fff"/>
   <circle cx="1.1" cy="-1.1" r=".38" fill="#000"/><circle cx="1.1" cy="1.1" r=".38" fill="#000"/></g></g>`;
  return s;
}
function place(i,animate=true){
  const [x,y]=xy(pos[i]);
  const off=pos[0]===pos[1]?(i===0?-1.6:1.6):0;
  const p=pawns[i];
  p.style.left=(x+off)+'%';p.style.top=(Math.min(y,100)+(pos[i]===0?-3:0))+'%';
}
function placeAll(){place(0);place(1);}
function msg(t){$('message').textContent=t}
function ui(){
  $('posYou').textContent=pos[0];$('posCom').textContent=pos[1];$('rolls').textContent=rolls;
  $('turn').textContent=over?'Over':(turn===0?'You':'Com');
  $('sideYou').classList.toggle('on',turn===0&&!over);$('sideCom').classList.toggle('on',turn===1&&!over);
  pawns.forEach((p,i)=>p.classList.toggle('active',i===turn&&!over));
  $('dice').disabled=busy||over||turn!==0;
}
function newGame(){
  pos=[0,0];turn=0;rolls=0;busy=false;over=false;
  $('win').style.display='none';$('dice').textContent='🎲';
  buildBoard();placeAll();ui();msg('Tap the dice to start.');
}
async function takeTurn(){
  busy=true;ui();
  const d=$('dice');d.classList.remove('rolling');void d.offsetWidth;d.classList.add('rolling');
  await sleep(380);
  const roll=Math.floor(Math.random()*6)+1;
  d.textContent=FACES[roll];rolls++;
  const who=turn===0?'You':'Computer';
  if(pos[turn]+roll>100){msg(`${who} rolled ${roll} — need exact number for 100.`);ui();await sleep(700);}
  else{
    msg(`${who} rolled ${roll}.`);
    for(let s=0;s<roll;s++){pos[turn]++;place(turn);ui();await sleep(230);}
    await sleep(250);
    const sq=pos[turn];
    if(LADDERS[sq]){msg(`🪜 ${who} climbed a ladder to ${LADDERS[sq]}!`);pos[turn]=LADDERS[sq];place(turn);ui();await sleep(650);}
    else if(SNAKES[sq]){msg(`🐍 ${who} got bitten! Slid down to ${SNAKES[sq]}.`);pos[turn]=SNAKES[sq];place(turn);ui();await sleep(650);}
    if(pos[turn]===100){finish(turn);return}
  }
  const extra=roll===6&&pos[turn]+0<100;
  if(!extra)turn=1-turn;else msg(`${who} rolled a 6 — roll again!`);
  busy=false;ui();
  if(turn===1&&!over){await sleep(600);takeTurn();}
}
function humanRoll(){if(busy||over||turn!==0)return;takeTurn()}
function finish(w){
  over=true;busy=false;ui();
  const won=w===0;
  $('winEmoji').textContent=won?'🏆':'🤖';
  $('winTitle').textContent=won?'You win!':'Computer wins!';
  $('winText').textContent=won?`You reached 100 in ${rolls} total rolls.`:'Better luck next time!';
  setTimeout(()=>{$('win').style.display='flex'},500);
  try{window.SJO.record(won?'win':'loss',won?Math.max(50,500-rolls*4):Math.floor(pos[0]*2),{rolls,you:pos[0],com:pos[1]})}catch(e){}
}
newGame();
</script>

<script src="sjo-v9-advanced-offline.js"></script>
