<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SJO Games</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f5f7fb;color:#111827}
.app{max-width:560px;margin:auto;min-height:100vh;padding:18px 15px 30px}
header{display:flex;align-items:center;gap:11px;margin-bottom:18px}.logo{width:44px;height:44px;border-radius:14px;background:#111827;color:white;display:grid;place-items:center;font-size:22px}h1{font-size:22px;margin:0}.sub{font-size:12px;color:#7b8498}
.tabs{display:flex;gap:7px;background:#e9edf5;padding:5px;border-radius:14px;margin-bottom:14px}.tabs button{flex:1;border:0;border-radius:10px;padding:10px;background:transparent;font-weight:800;color:#737d90}.tabs button.active{background:white;color:#111827;box-shadow:0 2px 8px #11182712}
.card{background:white;border:1px solid #e5e9f0;border-radius:24px;padding:16px;box-shadow:0 12px 35px #1118270c}
.score{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}.stat{background:#f5f7fb;border-radius:13px;text-align:center;padding:9px}.stat b{display:block;font-size:18px}.stat span{font-size:10px;color:#7b8498}
#ttt{width:min(86vw,390px);aspect-ratio:1;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.square{border:0;border-radius:18px;background:#f1f3f8;font-size:clamp(42px,16vw,78px);font-weight:800;color:#111827;box-shadow:inset 0 -2px 0 #e2e5ed}.square:disabled{opacity:1}.square.x{color:#3157d5}.square.o{color:#d64545}
.turn{text-align:center;min-height:25px;margin:13px 0 4px;color:#667085;font-weight:650}
.mode{display:flex;gap:7px;margin-top:14px}.mode button,.reset{flex:1;border:0;border-radius:13px;padding:12px;font-weight:800;background:#eef1f7;color:#273246}.mode button.active,.reset{background:#111827;color:white}.reset{width:100%;margin-top:9px}
.overlay{position:fixed;inset:0;background:#11182799;display:none;align-items:flex-end;padding:14px}.modal{width:min(530px,100%);background:white;border-radius:25px;padding:25px;text-align:center}.modal .emoji{font-size:44px}.modal h2{margin:7px 0}.modal p{color:#667085}.modal button{width:100%;border:0;border-radius:14px;padding:13px;background:#111827;color:white;font-weight:800}
</style>
<style id="sjo-nav">
#sjoNav{position:sticky;top:0;z-index:9999;display:flex;justify-content:space-between;align-items:center;
padding:9px 12px;background:#111827;color:#fff;font:700 13px system-ui;border-radius:0 0 14px 14px;box-shadow:0 5px 18px #11182722}
#sjoNav a{color:#fff;text-decoration:none;background:#ffffff18;border:1px solid #ffffff25;padding:7px 10px;border-radius:9px}
</style>
</head><body><nav id="sjoNav"><span>🎮 SJO Games</span><a href="index.html">⌂ Games</a></nav>
<div class="app">
<header><div class="logo">🎮</div><div><h1>SJO Games</h1><div class="sub">Play offline • More games coming</div></div></header>
<div class="tabs"><button onclick="location.href='index.html'">🧩 Sudoku</button><button class="active">❌⭕ Tic-Tac-Toe</button></div>
<div class="card">
<div class="score"><div class="stat"><b id="you">0</b><span>YOU</span></div><div class="stat"><b id="draw">0</b><span>DRAWS</span></div><div class="stat"><b id="cpu">0</b><span>COMPUTER</span></div></div>
<div id="ttt"></div><div class="turn" id="turn">Your turn — X</div>
<div class="mode"><button id="easy" class="active" onclick="setMode('easy')">Easy</button><button id="hard" onclick="setMode('hard')">Hard</button></div>
<button class="reset" onclick="newGame()">New Game</button>
</div></div>
<div class="overlay" id="win"><div class="modal"><div class="emoji" id="emoji">🏆</div><h2 id="title">You win!</h2><p id="result"></p><button onclick="document.getElementById('win').style.display='none';newGame()">Play Again</button></div></div>
<script src="sjo-core.js"></script>
<script>
let b=Array(9).fill(''),gameOver=false,mode='easy',turn='X',you=+localStorage.getItem('ttt_you')||0,cpu=+localStorage.getItem('ttt_cpu')||0,draw=+localStorage.getItem('ttt_draw')||0;
const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
function render(){let e=document.getElementById('ttt');e.innerHTML='';b.forEach((v,i)=>{let x=document.createElement('button');x.className='square '+(v?v.toLowerCase():'');x.textContent=v;x.disabled=!!v||gameOver||turn!=='X';x.onclick=()=>play(i);e.appendChild(x)});document.getElementById('turn').textContent=gameOver?'Game over':turn==='X'?'Your turn — X':'Computer is thinking…'}
function winner(a=b){for(let w of wins)if(a[w[0]]&&a[w[0]]===a[w[1]]&&a[w[1]]===a[w[2]])return a[w[0]];return a.every(Boolean)?'draw':null}
function play(i){if(turn!=='X'||b[i]||gameOver)return;b[i]='X';let r=winner();if(r)return finish(r);turn='O';render();setTimeout(cpuMove,mode==='hard'?180:280)}
function cpuMove(){if(gameOver)return;let moves=b.map((v,i)=>v?null:i).filter(x=>x!==null),pick;if(mode==='hard')pick=bestMove();else pick=moves[Math.floor(Math.random()*moves.length)];b[pick]='O';let r=winner();if(r)return finish(r);turn='X';render()}
function bestMove(){let best=-Infinity,move;for(let i=0;i<9;i++)if(!b[i]){b[i]='O';let s=minimax(false);b[i]='';if(s>best){best=s;move=i}}return move}
function minimax(maximizing){let r=winner();if(r==='O')return 10;if(r==='X')return -10;if(r==='draw')return 0;let best=maximizing?-Infinity:Infinity;for(let i=0;i<9;i++)if(!b[i]){b[i]=maximizing?'O':'X';let s=minimax(!maximizing);b[i]='';best=maximizing?Math.max(best,s):Math.min(best,s)}return best}
function finish(r){gameOver=true;window.SJO.record(r==='X'?'win':r==='O'?'loss':'draw',r==='X'?100:r==='O'?0:50,{mode});window.SJOGamesV9&&window.SJOGamesV9.record('Tic-Tac-Toe',r==='X'?'win':r==='O'?'loss':'draw',r==='X'?100:r==='O'?0:50);if(r==='X'){you++;save();title.textContent='You win!';emoji.textContent='🏆';result.textContent='Great move. Keep going!'}else if(r==='O'){cpu++;save();title.textContent='Computer wins';emoji.textContent='🤖';result.textContent='Try again — you can beat it.'}else{draw++;save();title.textContent='It’s a draw';emoji.textContent='🤝';result.textContent='No winner this round.'}document.getElementById('win').style.display='flex';render()}
function save(){localStorage.setItem('ttt_you',you);localStorage.setItem('ttt_cpu',cpu);localStorage.setItem('ttt_draw',draw);document.getElementById('you').textContent=you;document.getElementById('cpu').textContent=cpu;document.getElementById('draw').textContent=draw}
function newGame(){b=Array(9).fill('');gameOver=false;turn='X';render()}
function setMode(m){mode=m;document.querySelectorAll('.mode button').forEach(x=>x.classList.remove('active'));document.getElementById(m).classList.add('active');newGame()}
save();newGame();
</script><script src="sjo-v8-offline.js"></script>
<script src="sjo-v9-advanced-offline.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="sjo-supabase-sync.js"></script>
</body></html>
